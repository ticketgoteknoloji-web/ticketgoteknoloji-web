# ticketgoteknoloji.com — HTTP → HTTPS + apex → www
# Upstream: Next.js on 127.0.0.1:3001 (do not expose 3001 publicly)

upstream ticketgoteknoloji_next {
    server 127.0.0.1:3001;
    keepalive 32;
}

# Apex HTTP → www HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ticketgoteknoloji.com www.ticketgoteknoloji.com;
    return 301 https://www.ticketgoteknoloji.com$request_uri;
}
