# ticketgoteknoloji.com — HTTPS reverse proxy to Next.js (127.0.0.1:3001)
# Canonical host: https://www.ticketgoteknoloji.com
# Do NOT alias DOWNLOAD_STORAGE_DIR under a public location.

upstream ticketgoteknoloji_next {
    server 127.0.0.1:3001;
    keepalive 32;
}

# Apex HTTPS → www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ticketgoteknoloji.com;

    ssl_certificate     /etc/letsencrypt/live/www.ticketgoteknoloji.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.ticketgoteknoloji.com/privkey.pem;

    return 301 https://www.ticketgoteknoloji.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ticketgoteknoloji.com;

    ssl_certificate     /etc/letsencrypt/live/www.ticketgoteknoloji.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.ticketgoteknoloji.com/privkey.pem;

    # Enable HSTS only after HTTPS is verified end-to-end.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 2048m;

    # Longer timeouts only for large admin uploads
    location ^~ /api/downloads/admin/upload {
        proxy_pass http://ticketgoteknoloji_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 2048m;
    }

    location / {
        proxy_pass http://ticketgoteknoloji_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
