# www.ticket-go.net — HTTPS (statik site)

server {
    listen 80;
    server_name www.ticket-go.net ticket-go.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Apex → www
    if ($host = ticket-go.net) {
        return 301 https://www.ticket-go.net$request_uri;
    }

    location / {
        return 301 https://www.ticket-go.net$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name ticket-go.net;

    ssl_certificate     /etc/letsencrypt/live/www.ticket-go.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.ticket-go.net/privkey.pem;

    return 301 https://www.ticket-go.net$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.ticket-go.net;

    ssl_certificate     /etc/letsencrypt/live/www.ticket-go.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.ticket-go.net/privkey.pem;
    # Wildcard:
    # ssl_certificate     /etc/letsencrypt/live/ticket-go.net/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ticket-go.net/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /var/www/ticketgo-website/out;
    index index.html;

    client_max_body_size 2m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
