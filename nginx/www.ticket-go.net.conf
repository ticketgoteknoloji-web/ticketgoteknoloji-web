# www.ticket-go.net — statik kurumsal site (ticketgo-website/out)

server {
    listen 80;
    server_name www.ticket-go.net ticket-go.net;

    root /var/www/ticketgo-website/out;
    index index.html;

    client_max_body_size 2m;

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
